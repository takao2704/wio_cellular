[platformio]
src_dir = src

[env]
platform = https://github.com/SeeedJP/platform-nordicnrf52.git#8f55ff26c0822ffcbff978be1fddfb8c88c57577
platform_packages =
    framework-arduinoadafruitnrf52 @ https://github.com/SeeedJP/Adafruit_nRF52_Arduino.git#514f28ee405952ecc58558b5e0608a2b63d9901a
framework = arduino
board = seeed_wio_bg770a
board_upload.maximum_size = 397312
monitor_speed = 115200
build_flags =
    -DBOARD_VERSION_1_0
    -DCFG_LOGGER=0
lib_archive = no
lib_extra_dirs = ../../lib
lib_deps =
    seeedjp/WioCellular@0.3.15
    bblanchon/ArduinoJson@7.0.4

[env:ota_v1]
build_flags =
    ${env.build_flags}
    -DAPP_VERSION=1

[env:ota_v2]
build_flags =
    ${env.build_flags}
    -DAPP_VERSION=2

[env:ota_v3]
build_flags =
    ${env.build_flags}
    -DAPP_VERSION=3

[env:ota_v4]
build_flags =
    ${env.build_flags}
    -DAPP_VERSION=4

[env:ota_v2_m5_c1]
build_flags =
    ${env.build_flags}
    -DAPP_VERSION=2
    -DWIO_OTA_M5_HALT_BEFORE_ACTIVATE=1

[env:ota_v2_m5_c2]
build_flags =
    ${env.build_flags}
    -DAPP_VERSION=2
    -DWIO_OTA_M5_HALT_AFTER_ACTIVATE=1

; Add WIO_OTA_SECURE to a local override only after generating
; src/ota_manifest_public_key.h. Keeping it out of the default environments
; prevents an example placeholder key from being accepted accidentally.
